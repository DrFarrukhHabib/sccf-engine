name = "sccf-engine"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sccf"
database_id = "35755f80-bcef-41d3-b026-c3b83a8e1ee5"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "sccf-backups"

[triggers]
crons = ["17 3 * * *"]
